name: CloudHealth Technologies
description: 'CloudHealth Technologies is a cloud financial management (FinOps) and multi-cloud governance
  platform, founded in Boston and backed by Kleiner Perkins before being acquired by VMware in 2018 and
  now sold as CloudHealth by Broadcom. The platform helps organizations analyze and optimize cloud cost,
  usage, security, and governance across AWS, Microsoft Azure, and Google Cloud. It exposes a public developer
  surface: a REST API (organized around resource-oriented URLs, JSON responses, and standard HTTP status
  codes) and a GraphQL API for programmatically retrieving and managing accounts, assets, perspectives,
  billing rules, metrics, reporting (OLAP reports), policies, tagging, SSO, and partner/organization administration.
  Authentication is via a per-user API Key presented as a bearer token or api_key query parameter, enforcing
  the same role and organization scoping as the platform UI.'
